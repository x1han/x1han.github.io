<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>x1han</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f7f7f5;
        color: #222;
      }

      main {
        width: min(680px, 100%);
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 6vw, 4rem);
        line-height: 1;
      }

      p {
        margin: 0;
        color: #555;
        font-size: 1.1rem;
        line-height: 1.6;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: #151515;
          color: #f1f1ed;
        }

        p {
          color: #bbb;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>x1han</h1>
      <p>Personal site.</p>
    </main>
  </body>
</html>
